<title>Victoria Deneme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
:root{color-scheme:light}
html,body{background:#f5f7fa}
/* Victoria prototype — mirrors the reconciliation app look (Ant Design 5 tokens, slate sider, indigo primary, Geist) */
:root{
  --primary:#4f46e5; --primary-600:#4338ca; --primary-50:#eef2ff; --primary-100:#e0e7ff;
  --sider:#0f172a; --sider-2:#1e293b; --sider-text:#94a3b8;
  --bg:#f5f7fa; --surface:#ffffff; --border:#e2e8f0; --border-2:#f1f5f9;
  --text:#1a1a2e; --text-2:#475569; --muted:#64748b; --head:#f8fafc;
  --success:#059669; --success-bg:#ecfdf5; --warning:#d97706; --warning-bg:#fffbeb;
  --error:#dc2626; --error-bg:#fef2f2; --info:#0284c7; --info-bg:#f0f9ff;
  --ai:#7c3aed; --ai-bg:#f5f3ff; --ai-border:#ddd6fe;
  --radius:6px; --radius-lg:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Geist','Inter',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5715;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-600)}
h1,h2,h3,h4{margin:0;font-weight:600}
svg.lucide{width:16px;height:16px;stroke-width:2;flex-shrink:0}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh}
.sider{width:232px;background:var(--sider);color:var(--sider-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0;z-index:100}
.sider .brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff;font-weight:700;font-size:16px;border-bottom:1px solid var(--sider-2)}
.sider .brand{height:64px;text-decoration:none}
.sider .brand .logo-img{width:40px;height:40px;border-radius:10px;object-fit:cover;box-shadow:0 0 0 1px rgba(212,175,108,.45)}
.sider .brand .brand-name{display:block;font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;font-size:17px;line-height:1.1;color:#e9cf9c}
.sider .brand .brand-tag{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a08a63;font-weight:500}
.nav{flex:1;overflow:auto;padding:10px 8px;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.35) transparent}
.nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;padding:14px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:2px 0;border-radius:var(--radius);color:var(--sider-text);font-size:14px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav a.active{background:var(--primary);color:#fff}
.nav a .pill{margin-left:auto;font-size:10px;padding:0 6px;border-radius:999px;background:rgba(148,163,184,.2);color:#cbd5e1}
.sider .foot{padding:12px 16px;border-top:1px solid var(--sider-2);font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 32px;position:sticky;top:0;z-index:99}
.header .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px;width:340px;color:var(--muted);background:#fff}
.header .search input{border:none;outline:none;font:inherit;flex:1;min-width:0}
.header .spacer{flex:1}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 8px;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;font:inherit}
.icon-btn:hover{background:var(--border-2)}
.icon-btn .dot{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--error);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lang button{border:none;background:#fff;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--primary-50);color:var(--primary);font-weight:600}
.lang a.lang-link{display:inline-block;padding:3px 9px;font-size:12px;color:var(--muted);background:#fff;line-height:1.5715}
.lang a.lang-link:hover{color:var(--primary);background:var(--primary-50)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary-100);color:var(--primary-600);display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.avatar.lg{width:56px;height:56px;font-size:18px}
.content{padding:28px 32px;flex:1;min-width:0}
.proto-banner{background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;font-size:12px;padding:4px 32px;display:flex;gap:8px;align-items:center}

/* ---------- Page header ---------- */
.page-header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.page-header .title{border-left:4px solid var(--primary);padding-left:14px;min-width:0}
.page-header h1{font-size:24px;font-weight:700;line-height:1.25}
.page-header p{margin:8px 0 0;color:var(--muted);font-size:13px}
/* Treatment-room tablet: bigger touch targets */
body.touch .content .btn{height:40px;padding:0 18px;font-size:15px}
body.touch .content .btn.sm{height:34px;padding:0 12px;font-size:14px}
body.touch .content .input,body.touch .content .select{height:40px}
body.touch .content .table td{padding:12px}
.appt-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border-2)}
.appt-row:last-child{border-bottom:none}
.appt-row .time{font-size:18px;font-weight:600;width:64px;font-variant-numeric:tabular-nums}
.appt-row.done{opacity:.55}
.next-card{border:2px solid var(--primary);border-radius:var(--radius-lg);background:#fff;padding:18px}
/* Sign-in */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#f7efe3,#efe4d3 60%,#e7d9c3);padding:24px}
.login-box{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(120,90,40,.15);padding:28px;width:100%;max-width:560px;min-width:0}
.user-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.user-tile{border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;background:#fff;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.user-tile:hover,.user-tile.on{border-color:#c9a86a;background:#fbf6ee}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin span{width:14px;height:14px;border-radius:50%;border:2px solid #c9a86a}
.pin span.f{background:#c9a86a}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
.pad button{height:56px;border-radius:12px;border:1px solid var(--border);background:#fff;font:inherit;font-size:20px;cursor:pointer}
.pad button:hover{background:#fbf6ee}
@media (max-width:560px){.user-tiles{grid-template-columns:repeat(2,1fr)}}
.page-header.sub{margin-bottom:16px;align-items:center}
.page-header.sub .title{border:none;padding:0}
.page-header.sub h1{display:none}
.page-header.sub p{margin:0}
.tabs.main-tabs{margin-bottom:20px}
.tabs.main-tabs button{font-size:15px}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;align-items:center}
.breadcrumb a{color:var(--muted)} .breadcrumb a:hover{color:var(--primary)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 15px;border-radius:var(--radius);border:1px solid #d9d9d9;background:#fff;color:var(--text);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.02)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 0 rgba(79,70,229,.1)}
.btn.primary:hover{background:#6366f1;color:#fff}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ai:hover{background:#8b5cf6;color:#fff}
.btn.danger{color:var(--error);border-color:#fecaca}
.btn.text{border-color:transparent;box-shadow:none;background:transparent}
.btn.text:hover{background:var(--border-2);color:var(--text)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.block{width:100%;justify-content:center}
.btn.lg{height:40px;font-size:16px;padding:0 18px}
.input,.select,textarea.input{height:32px;padding:4px 11px;border:1px solid #d9d9d9;border-radius:var(--radius);font:inherit;font-size:14px;background:#fff;color:var(--text);width:100%;min-width:0}
textarea.input{height:auto;min-height:72px;resize:vertical}
.input:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(79,70,229,.1)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--text-2)}
.field label .req{color:var(--error)}
.field .hint{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.form-grid .span-2{grid-column:span 2}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:28px;height:16px;border-radius:8px;background:#cbd5e1;position:relative;transition:.2s}
.switch .track::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.switch input:checked+.track{background:var(--primary)}
.switch input:checked+.track::after{left:14px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filter-bar .input,.filter-bar .select{width:auto;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chips button:hover{border-color:var(--ai);color:var(--ai)}
.chips button.on{background:var(--ai-bg);border-color:var(--ai);color:#5b21b6;font-weight:500}
.chips button.on::before{content:"✓";font-size:11px}
.needs-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.needs-grid{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--border-2);border-radius:var(--radius);padding:2px}
.seg button{border:none;background:transparent;padding:3px 12px;border-radius:4px;font:inherit;font-size:13px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--text);font-weight:500}

/* ---------- Cards, grid ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-2);min-height:48px}
.card-head h3{font-size:15px;display:flex;gap:8px;align-items:center}
.card-body{padding:16px}
.card-body.flush{padding:0;overflow-x:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-side{grid-template-columns:300px minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid>*,.stack>*{min-width:0}
.desc dd{overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.mt{margin-top:16px} .mb{margin-bottom:16px}
.muted{color:var(--muted)} .small{font-size:12px} .strong{font-weight:600}
.right{text-align:right}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}

.stat{border-radius:var(--radius-lg);padding:12px 16px;border:1px solid var(--border);border-left:4px solid var(--muted);background:#f1f5f9}
.stat .label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat .value{font-size:24px;font-weight:600;margin-top:4px;color:#475569}
.stat .note{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:4px;align-items:center}
.stat.primary{background:#eef2ff;border-left-color:#4f46e5}.stat.primary .value{color:#4338ca}
.stat.success{background:#ecfdf5;border-left-color:#059669}.stat.success .value{color:#059669}
.stat.warning{background:#fffbeb;border-left-color:#d97706}.stat.warning .value{color:#92400e}
.stat.error{background:#fef2f2;border-left-color:#dc2626}.stat.error .value{color:#991b1b}
.up{color:var(--success)} .down{color:var(--error)}

/* ---------- Tags / pills ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:20px;padding:0 8px;border-radius:4px;border:1px solid var(--border);background:#fafafa;color:var(--text-2);white-space:nowrap}
.tag.green{background:var(--success-bg);border-color:#a7f3d0;color:#047857}
.tag.orange{background:var(--warning-bg);border-color:#fde68a;color:#b45309}
.tag.red{background:var(--error-bg);border-color:#fecaca;color:#b91c1c}
.tag.blue{background:var(--info-bg);border-color:#bae6fd;color:#0369a1}
.tag.indigo{background:var(--primary-50);border-color:var(--primary-100);color:var(--primary-600)}
.tag.purple{background:var(--ai-bg);border-color:var(--ai-border);color:var(--ai)}
.tag svg.lucide{width:12px;height:12px}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto}
table.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{background:var(--head);color:var(--muted);font-size:12px;font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:8px 12px;border-bottom:1px solid var(--border-2);vertical-align:middle}
.table tbody tr:hover td{background:var(--primary-50)}
.table tr.clickable{cursor:pointer}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.table tfoot td{font-weight:600;background:var(--head)}
.pagination{display:flex;justify-content:flex-end;gap:4px;padding:12px 16px;align-items:center;font-size:13px;color:var(--muted)}
.pagination button{min-width:28px;height:28px;border:1px solid var(--border);background:#fff;border-radius:var(--radius);cursor:pointer;font:inherit}
.pagination button.on{border-color:var(--primary);color:var(--primary)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:none;padding:10px 0;font:inherit;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--primary)}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tab-panel{display:none}
.tab-panel.on{display:block}

/* ---------- Alerts ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;border:1px solid;font-size:13px}
.alert.warning{background:var(--warning-bg);border-color:#fde68a;color:#92400e}
.alert.error{background:var(--error-bg);border-color:#fecaca;color:#991b1b}
.alert.info{background:var(--info-bg);border-color:#bae6fd;color:#075985}
.alert.success{background:var(--success-bg);border-color:#a7f3d0;color:#065f46}
.alert.ai{background:var(--ai-bg);border-color:var(--ai-border);color:#5b21b6}
.alert svg.lucide{margin-top:2px}

/* ---------- Lists, timeline, descriptions ---------- */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border-2)}
.list li:last-child{border-bottom:none}
.list .grow{flex:1;min-width:0}
.desc{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;font-size:13px}
.desc dt{color:var(--muted)} .desc dd{margin:0}
.timeline{list-style:none;margin:0;padding:0 0 0 8px}
.timeline li{position:relative;padding:0 0 18px 22px;border-left:2px solid var(--border)}
.timeline li:last-child{border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.timeline li.sale::before{border-color:var(--success)}
.timeline li.ai::before{border-color:var(--ai)}
.timeline li.note::before{border-color:var(--warning)}
.timeline .when{font-size:12px;color:var(--muted)}
.progress{height:8px;background:var(--border-2);border-radius:4px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--primary);border-radius:4px}
.progress.green>span{background:var(--success)} .progress.orange>span{background:var(--warning)} .progress.red>span{background:var(--error)}

/* ---------- Calendar ---------- */
.cal{display:grid;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:auto;background:#fff;max-height:calc(100vh - 230px)}
.cal .colhead{position:sticky;top:0;background:var(--head);border-bottom:1px solid var(--border);border-left:1px solid var(--border-2);padding:8px;font-size:13px;font-weight:600;z-index:2;display:flex;gap:8px;align-items:center}
.cal .colhead small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.cal .corner{position:sticky;top:0;left:0;z-index:3;background:var(--head);border-bottom:1px solid var(--border)}
.cal .times{position:sticky;left:0;background:#fff;z-index:1}
.cal .time{height:48px;font-size:11px;color:var(--muted);text-align:right;padding:2px 8px 0 0;border-bottom:1px solid var(--border-2)}
.cal .col{position:relative;border-left:1px solid var(--border-2)}
.cal .slot{height:48px;border-bottom:1px solid var(--border-2)}
.cal .slot:hover{background:var(--primary-50);cursor:pointer}
.cal .off{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#f1f5f9 6px,#f1f5f9 12px)}
.appt{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 6px;font-size:12px;line-height:1.3;overflow:hidden;border-left:3px solid;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.appt b{display:block;font-weight:600}
.appt.c1{background:#eef2ff;border-color:#4f46e5;color:#3730a3}
.appt.c2{background:#fdf2f8;border-color:#db2777;color:#9d174d}
.appt.c3{background:#ecfdf5;border-color:#059669;color:#065f46}
.appt.c4{background:#fff7ed;border-color:#ea580c;color:#9a3412}
.appt.c5{background:#f0f9ff;border-color:#0284c7;color:#075985}
.appt.done{opacity:.6}
.appt .warn{color:var(--error)}

/* ---------- Drawer & modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:900;display:none}
.overlay.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;max-width:100vw;background:#fff;z-index:901;box-shadow:-6px 0 16px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.wide{width:720px}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.drawer-head h3{font-size:16px;display:flex;gap:8px;align-items:center}
.drawer-body{flex:1;overflow:auto;padding:20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.modal{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:520px;max-width:calc(100vw - 32px);background:#fff;border-radius:8px;z-index:901;display:none;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.modal.on{display:block}

/* ---------- AI ---------- */
.ai-card{border:1px solid var(--ai-border);background:linear-gradient(180deg,#faf5ff,#fff 120px);border-radius:var(--radius-lg)}
.ai-card .card-head{border-bottom-color:var(--ai-border)}
.ai-card .card-head h3{color:#5b21b6}
.reco{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.reco .why{font-size:13px;color:var(--text-2)}
.reco .caution{font-size:12px;color:#b45309;display:flex;gap:6px}
.reco.accepted{border-color:#a7f3d0;background:#f0fdf4}
.reco.rejected{opacity:.55}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 12px;border-radius:10px;font-size:13px}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:2px}
.msg.bot{align-self:flex-start;background:var(--ai-bg);border:1px solid var(--ai-border);border-bottom-left-radius:2px}
.disclaimer{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff;cursor:pointer;font-size:13px}
.tile:hover{border-color:var(--primary);background:var(--primary-50)}
.tile .price{font-weight:600;margin-top:4px}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px}
.totals .grand{font-size:20px;font-weight:700;color:var(--primary-600)}
.pay-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plan-box{border:1px solid var(--primary-100);background:#fafaff;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pay-methods button{height:56px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pay-methods button.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary)}
.upload{border:1px dashed #cbd5e1;border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;background:#fafafa;cursor:pointer}
.upload:hover{border-color:var(--primary);color:var(--primary)}
.photo{aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,#fce7f3,#e0e7ff);display:grid;place-items:center;color:#94a3b8;font-size:12px;position:relative}
.photo span{position:absolute;bottom:6px;left:6px;background:rgba(255,255,255,.85);padding:0 6px;border-radius:4px;color:var(--text-2);font-size:11px}

/* ---------- Bars (simple chart) ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding:8px 4px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:36px;background:var(--primary);border-radius:4px 4px 0 0}
.bars .b i.alt{background:#a5b4fc}
.hbar{display:grid;grid-template-columns:140px 1fr 80px;gap:10px;align-items:center;font-size:13px;margin:8px 0}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.pos,.g-side{grid-template-columns:1fr}}
@media (max-width:760px){
  .sider{display:none}.header{padding:0 12px;gap:4px}.header .search{width:auto;flex:1;min-width:0}.header .search .small,.header .btn.sm{display:none}.content{padding:16px 12px}
  .g2,.g3,.g4{grid-template-columns:1fr}.form-grid .span-2{grid-column:auto}.proto-banner{padding:4px 12px}
}

.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e2e8f0;box-shadow:0 6px 16px rgba(0,0,0,.08);border-radius:8px;padding:8px 14px;z-index:1000;display:none;font-size:13px;max-width:90vw}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border-2)}

.cart-line .grow{flex:1;min-width:0}
.cal .col{min-height:480px}
.cal .colbody{position:relative;height:480px;cursor:copy}
.cal .colbody .hour{height:48px;border-bottom:1px solid var(--border-2)}
.cal .colbody .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#f1f5f9 6px,#f1f5f9 12px);pointer-events:none}
.summary h2{margin-top:24px}

/* ---- core.js ---- */
/* Victoria demo — core: helpers, state, router, shell, drawers, event wiring. */
(function () {
  // ---------- Formatting & dates ----------
  V.money = (n) => (n < -0.5 ? '−' : '') + '₺' + Math.abs(Math.round(n || 0)).toLocaleString('tr-TR');
  V.esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  V.d = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d || 1)); };
  V.iso = (d) => d.toISOString().slice(0, 10);
  V.addDays = (s, n) => { const d = V.d(s); d.setUTCDate(d.getUTCDate() + n); return V.iso(d); };
  V.addMonths = (s, n) => { const d = V.d(s); d.setUTCMonth(d.getUTCMonth() + n); return V.iso(d); };
  V.days = (a, b) => Math.round((V.d(b) - V.d(a)) / 864e5);
  V.ds = (s) => (s && s.length >= 10 ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : s && s.length === 7 ? s.slice(5, 7) + '/' + s.slice(0, 4) : s || '');
  V.dayName = (s) => ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'][V.d(s).getUTCDay()];
  V.mins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  V.hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  V.num = (v) => { const n = parseFloat(String(v || '').replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };

  // ---------- State ----------
  const KEY = 'victoria-demo-v1';
  V.load = () => { try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && o.v === 1) return o; } } catch (e) {} return V.seed(); };
  V.save = () => { try { localStorage.setItem(KEY, JSON.stringify(V.S)); } catch (e) {} };
  V.reset = () => { V.S = V.seed(); V.UI = {}; V.save(); V.go('#/baslangic'); V.toast('Demo sıfırlandı'); };
  V.id = (k, prefix, pad) => { V.S.seq[k] = (V.S.seq[k] || 0) + 1; return prefix + String(V.S.seq[k]).padStart(pad || 0, '0'); };
  V.UI = {};

  // ---------- Lookups ----------
  const by = (arr, id) => arr.find((x) => x.id === id);
  V.cust = (id) => by(V.S.customers, id);
  V.staff = (id) => by(V.S.staff, id);
  V.svc = (id) => by(V.S.services, id);
  V.prod = (id) => by(V.S.products, id);
  V.tpl = (id) => by(V.S.templates, id);
  V.pkg = (id) => by(V.S.packages, id);
  V.appt = (id) => by(V.S.appts, id);
  V.plan = (id) => by(V.S.plans, id);
  V.sale = (id) => by(V.S.sales, id);
  V.dev = (id) => by(V.S.devices, id);
  V.area = (svcId, areaId) => { const s = V.svc(svcId); return s && s.areas ? s.areas.find((a) => a.id === areaId) : null; };
  V.svcLabel = (svcId, areaId) => { const s = V.svc(svcId); const a = V.area(svcId, areaId); return s ? s.name + (a ? ' · ' + a.name : '') : ''; };
  V.svcPrice = (svcId, areaId) => { const a = V.area(svcId, areaId); return a ? a.price : (V.svc(svcId) || {}).price || 0; };
  V.svcDur = (svcId, areaId) => { const a = V.area(svcId, areaId); return a ? a.dur : (V.svc(svcId) || {}).dur || 30; };
  V.user = () => V.S.session ? V.staff(V.S.session.user) : V.staff('fk');
  V.isSpecialist = () => (V.user() || {}).kind === 'specialist';
  V.specialists = () => V.S.staff.filter((s) => s.kind === 'specialist');

  // ---------- Money & plans ----------
  V.lineTotal = (l) => l.qty * l.price * (1 - (l.disc || 0) / 100);
  V.saleTotal = (s) => s.lines.reduce((a, l) => a + V.lineTotal(l), 0) - (s.discount || 0);
  V.salePaid = (s) => (s.payments || []).reduce((a, p) => a + p.amount, 0);
  V.instOpen = (i) => i.amount - (i.paid || 0);
  V.planOpen = (p) => p.inst.reduce((a, i) => a + V.instOpen(i), 0);
  V.custBalance = (cid) => V.S.plans.filter((p) => p.customer === cid).reduce((a, p) => a + V.planOpen(p), 0);
  V.custOverdue = (cid) => V.openInst().filter((x) => x.plan.customer === cid && x.inst.due < V.TODAY).reduce((a, x) => a + V.instOpen(x.inst), 0);
  V.openInst = () => {
    const out = [];
    V.S.plans.forEach((p) => p.inst.forEach((i, n) => { if (V.instOpen(i) > 0.5) out.push({ plan: p, inst: i, n: n + 1, of: p.inst.length }); }));
    return out.sort((a, b) => a.inst.due.localeCompare(b.inst.due));
  };
  V.instStatus = (i) => {
    if (V.instOpen(i) <= 0.5) return ['Ödendi', 'green'];
    const d = V.days(V.TODAY, i.due);
    if (d < 0) return [-d + ' gün gecikti', 'red'];
    if (d === 0) return ['Bugün', 'orange'];
    if (d <= 7) return [d + ' gün sonra', 'orange'];
    return ['Planlandı', ''];

  V.consentOk = (c, key) => c.consents && c.consents[key] && c.consents[key] >= V.TODAY;

  // Appointment warnings (shown when booking and on the appointment).
  V.apptWarnings = (a) => {
    const c = V.cust(a.customer), s = V.svc(a.service), w = [];
    if (!c || !s) return w;
    if (s.consent && !V.consentOk(c, s.consent)) w.push(['error', (V.CONSENTS.find((x) => x[0] === s.consent) || [])[1] + ' eksik veya süresi dolmuş']);
    if (c.allergies && c.allergies.length) w.push(['warning', 'Alerji: ' + c.allergies.join(', ')]);
    if (c.note) w.push(['warning', c.note]);
    const hit = (s.contra || []).filter((f) => (c.flags || []).includes(f) && f !== 'lazer_kur');
    if (hit.length) w.push(['error', 'Kontrendikasyon: ' + hit.map((f) => V.FLAG_TEXT[f]).join(', ')]);
    return w;
  };
  V.conflict = (a, ignoreId) => {
    const s1 = V.mins(a.start), e1 = s1 + a.dur;
    return V.S.appts.find((b) => b.id !== ignoreId && b.date === a.date && !['cancelled', 'noshow'].includes(b.status) &&
      (b.staff === a.staff || (a.device && b.device === a.device)) && V.mins(b.start) < e1 && s1 < V.mins(b.start) + b.dur);
  };

  // ---------- Router & shell ----------
  V.screens = {};
  V.drawers = {};
  V.act = {};
  V.route = () => {
    const h = (V.UI.at || '').replace(/^#\/?/, '');
    const [path, qs] = h.split('?');
    const parts = path.split('/').filter(Boolean);
    const q = {}; (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); q[k] = decodeURIComponent(v || ''); });
    return { name: parts[0] || '', param: parts[1], q };
  };
  // In-page navigation: hosted pages only allow plain #name hashes, so the route lives in V.UI.at.
  V.go = (h) => {
    const changed = V.UI.at !== h;
    V.UI.at = h;
    if (changed) { V.UI.drawer = V.UI.keepDrawer ? V.UI.drawer : null; V.UI.keepDrawer = false; }
    V.render(); if (changed) window.scrollTo(0, 0); V.flushToast();
  };

  const NAV_OWNER = [
    ['Demo', [['baslangic', 'Nasıl test edilir?', 'flag'], ['ozet', 'Gereksinim özeti', 'file-text']]],
    ['Günlük', [['bugun', 'Bugün', 'sun'], ['takvim', 'Takvim', 'calendar-days'], ['musteriler', 'Müşteriler', 'users'], ['kasa', 'Kasa', 'wallet']]],
    ['Yönetim', [['katalog', 'Katalog ve stok', 'package'], ['ekip', 'Ekip', 'user-cog'], ['ayarlar', 'Ayarlar', 'settings']]]
  ];
  const NAV_SPEC = [
    ['Demo', [['baslangic', 'Nasıl test edilir?', 'flag']]],
    ['Günlük', [['gunum', 'Günüm', 'sun'], ['takvim', 'Takvim', 'calendar-days'], ['musteriler', 'Müşteriler', 'users'], ['kasa', 'Kasa', 'wallet']]]
  ];
  const ACTIVE = { musteri: 'musteriler', danisma: 'musteriler', uygulama: 'takvim' };

  V.render = () => {
    const r = V.route();
    if (!r.name) { V.go(V.S.seenStart ? (V.S.session ? (V.isSpecialist() ? '#/gunum' : '#/bugun') : '#/giris') : '#/baslangic'); return; }
    const app = document.getElementById('app');
    document.body.classList.remove('touch');
    if (r.name === 'giris') { app.innerHTML = V.screens.giris(r); V.icons(); return; }
    const screen = V.screens[r.name] || V.screens.bugun;
    let body;
    try { body = screen(r); } catch (e) { console.error(e); body = '<div class="alert error">Bu ekranda bir hata oluştu: ' + V.esc(e.message) + '</div>'; }
    const u = V.user(), spec = V.isSpecialist(), active = ACTIVE[r.name] || r.name;
    const overdue = V.openInst().filter((x) => x.inst.due < V.TODAY).length;
    const missing = V.S.sales.filter((s) => !s.receipt && !s.refunded).length;
    const nav = (spec ? NAV_SPEC : NAV_OWNER).map(([g, items]) => '<div class="group">' + g + '</div>' + items.map(([id, label, icon]) =>
      '<a href="#/' + id + '" class="' + (active === id ? 'active' : '') + '"><i data-lucide="' + icon + '"></i>' + label +
      (id === 'kasa' && overdue + missing ? '<span class="pill">' + (overdue + missing) + '</span>' : '') + '</a>').join('')).join('');
    app.innerHTML =
      '<div class="shell"><aside class="sider"><a class="brand" href="#/' + (spec ? 'gunum' : 'bugun') + '"><img class="logo-img" src="' + V.LOGO + '" alt="Victoria"><span><span class="brand-name">VICTORIA</span><span class="brand-tag">Güzellik &amp; Bakım</span></span></a>' +
      '<nav class="nav">' + nav + '</nav><div class="foot">Demo · ' + V.ds(V.TODAY) + ' ' + V.dayName(V.TODAY) + ', ' + V.NOW + '<br><a href="#" data-act="reset" style="color:#a08a63">Demoyu sıfırla</a></div></aside>' +
      '<div class="main"><header class="header"><label class="search"><i data-lucide="search"></i><input placeholder="Müşteri ara: isim veya telefon" data-input="search" value="' + V.esc(V.UI.search || '') + '"></label><div class="spacer"></div>' +
      '<a class="btn sm ai" href="#/danisma"><i data-lucide="sparkles"></i>Hızlı danışma</a>' +
      (spec ? '' : '<a class="btn sm" href="#" data-act="newAppt"><i data-lucide="calendar-plus"></i>Yeni randevu</a>') +
      '<a class="avatar" href="#/giris" title="Kullanıcı değiştir">' + V.esc(u.initials) + '</a></header>' +
      '<div class="proto-banner"><i data-lucide="flask-conical"></i>Deneme sürümü: veriler yalnızca bu tarayıcıda tutulur, hiçbir yere gönderilmez. Bugün ' + V.ds(V.TODAY) + ' kabul edilir. <a href="#/baslangic" style="margin-left:auto">Görevler</a></div>' +
      '<main class="content">' + body + '</main></div></div>' +
      '<div class="overlay" id="overlay" data-act="closeDrawer"></div><aside class="drawer" id="drawer"></aside>' +
      '<div class="toast" id="toast"></div>';
    if (V.UI.drawer) V.renderDrawer();
    V.icons();
    if (V.UI.focusSearch) { const i = document.querySelector('[data-input="search"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } V.UI.focusSearch = false; }
  };
  V.icons = () => { if (window.lucide) lucide.createIcons(); };

  V.openDrawer = (kind, data) => { V.UI.drawer = { kind, data: data || {} }; V.renderDrawer(); };
  V.renderDrawer = () => {
    const el = document.getElementById('drawer'), ov = document.getElementById('overlay');
    if (!el) return;
    const d = V.UI.drawer;
    if (!d) { el.classList.remove('on', 'wide'); ov.classList.remove('on'); return; }
    const out = V.drawers[d.kind](d.data);
    el.className = 'drawer on' + (out.wide ? ' wide' : '');
    el.innerHTML = '<div class="drawer-head"><h3>' + out.title + '</h3><button class="icon-btn" data-act="closeDrawer"><i data-lucide="x"></i></button></div>' +
      '<div class="drawer-body stack">' + out.body + '</div>' + (out.foot ? '<div class="drawer-foot">' + out.foot + '</div>' : '');
    ov.classList.add('on');
    V.icons();
  };
  V.closeDrawer = () => { V.UI.drawer = null; V.renderDrawer(); };
  V.form = (scope) => {
    const o = {};

      if (el.type === 'checkbox') { if (el.dataset.multi) { o[el.name] = o[el.name] || []; if (el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; }

  V.act.setUI = (el) => { V.UI[el.dataset.key] = el.dataset.val; V.render(); };
  V.act.drawerSync = () => { V.syncDrawer(); V.renderDrawer(); };
  V.act.drawerSet = (el) => { V.syncDrawer(); V.UI.drawer.data[el.dataset.key] = el.dataset.val; V.renderDrawer(); };

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');

      e.preventDefault();
      const fn = V.act[a.dataset.act]; if (fn) fn(a, e); else console.warn('no action', a.dataset.act);
      return;
    }
    const link = e.target.closest('a[href^="#/"]');
    if (link) { e.preventDefault(); V.go(link.getAttribute('href')); return; }
    const r = e.target.closest('[data-href]');
    if (r && !e.target.closest('a,button,input,select,textarea')) V.go(r.dataset.href);
  });
  document.addEventListener('change', (e) => { const a = e.target.closest('[data-change]'); if (a) { const fn = V.act[a.dataset.change]; if (fn) fn(a, e); } });
  document.addEventListener('input', (e) => { const a = e.target.closest('[data-input]'); if (a) { const fn = V.act[a.dataset.input]; if (fn) fn(a, e); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') V.closeDrawer(); });
  window.addEventListener('hashchange', () => { if ((location.hash || '').startsWith('#/')) V.go(location.hash); });
  const boot = () => { V.S = V.load(); V.UI.at = (location.hash || '').startsWith('#/') ? location.hash : ''; V.render(); };
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot); else boot();
})();

        '<div class="row wrap mt" style="gap:6px">' + w.map(([k, txt]) => V.tag(txt, k === 'error' ? 'red' : 'orange')).join('') + (w.length ? '' : V.tag('Onamlar geçerli', 'green')) + V.tag('Fitzpatrick ' + c.fitz) +
        (last && last.fluence ? V.tag('Geçen sefer: ' + last.fluence + ' J/cm² · ' + last.shots + ' atım · ' + last.reaction) : '') + '</div></div>' +
        '<div class="row wrap"><a class="btn" href="#/musteri/' + c.id + '"><i data-lucide="user-round"></i>Müşteri</a><a class="btn ai" href="#/danisma/' + c.id + '"><i data-lucide="sparkles"></i>Danış</a>' +
        (next.status === 'checkedin' || next.status === 'inprogress' ? '<a class="btn primary" href="#/uygulama/' + next.id + '"><i data-lucide="play"></i>Uygulamayı başlat</a>' : '<button class="btn primary" data-act="setStatus" data-id="' + next.id + '" data-val="checkedin"><i data-lucide="log-in"></i>Geldi olarak işaretle</button>') + '</div></div></div>';
    }
    const rows = mine.map((a) => { const c = V.cust(a.customer), fin = ['completed', 'paid'].includes(a.status);
      return '<div class="appt-row' + (fin ? ' done' : '') + '"><span class="time">' + a.start + '</span><div class="grow"><b>' + V.esc(c.name) + '</b><div class="small muted">' + V.esc(V.svcLabel(a.service, a.area)) + '</div></div>' +
        (fin ? V.statusTag(a.status) : a.status === 'checkedin' ? '<a class="btn sm primary" href="#/uygulama/' + a.id + '">Başlat</a>' : V.statusTag(a.status)) + '</div>'; }).join('');
    return V.header('İyi günler, ' + u.name.split(' ')[0].replace('Dr.', u.name.split(' ')[1] || ''), V.ds(V.TODAY) + ' ' + V.dayName(V.TODAY) + ' · ' + mine.length + ' randevu · ' + done + ' tamamlandı',
      '<a class="btn ai" href="#/danisma"><i data-lucide="sparkles"></i>Hızlı danışma</a>') + nextHtml +
      '<div class="grid g-main"><div class="card"><div class="card-head"><h3><i data-lucide="calendar-days"></i>Bugünkü randevularım</h3></div><div>' + (rows || '<div class="card-body muted">Randevu yok</div>') + '</div></div>' +
      '<div class="stack"><div class="alert info"><i data-lucide="info"></i><div>Uzman görünümü: kısa menü, büyük düğmeler, yalnızca kendi randevularınız. Ciro raporları görünmez.</div></div><a class="btn" href="#/giris" style="align-self:flex-start"><i data-lucide="log-out"></i>Kullanıcı değiştir</a></div></div>';
  };
})();

(function () {

      const appts = S().appts.filter((a) => a.date === date && a.staff === s.id && !['cancelled'].includes(a.status));
      const off = [[DAY_START, s.hours[0] * 60], [s.hours[1] * 60, DAY_END]].filter(([a, b]) => b > a)
        .map(([a, b]) => '<div class="off" style="top:' + (a - DAY_START) * PX + 'px;height:' + (b - a) * PX + 'px"></div>').join('');
      const blocks = appts.map((a) => {

          '<b>' + V.esc(c.name) + (warn ? ' <span class="warn">⚠</span>' : '') + '</b>' + a.start + ' · ' + V.esc(V.svcLabel(a.service, a.area)) + ' · ' + V.STATUS[a.status][0] + '</div>';
      }).join('');
      return '<div class="col"><div class="colbody" data-act="slot" data-staff="' + s.id + '">' + Array(10).fill('<div class="hour"></div>').join('') + off + blocks + '</div></div>';

  // ---------- New appointment ----------

    V.openDrawer('newAppt', d);

    if (!s.areas) d.area = '';

        '<div class="form-grid">' +
        '<div class="field"><label>Hizmet</label><select class="select" name="service" data-change="drawerSync">' + S().services.map((x) => V.opt(x.id, x.name, d.service)).join('') + '</select></div>' +

        '<div class="field"><label>Personel</label><select class="select" name="staff" data-change="drawerSync">' + s.staff.map((id) => V.opt(id, V.staff(id).name, d.staff)).join('') + '</select><span class="hint">' + (s.physician ? 'Bu işlem yalnızca hekim tarafından yapılır.' : 'Yalnızca bu işleme yetkili personel listelenir.') + '</span></div>' +
        (s.device ? '<div class="field"><label>Cihaz</label><select class="select" name="device" data-change="drawerSync">' + S().devices.map((x) => V.opt(x.id, x.name, d.device)).join('') + '</select></div>' : '') +
        '<div class="field"><label>Tarih</label><input class="input" type="date" name="date" value="' + d.date + '" data-change="drawerSync"></div>' +

        (clash ? '<div class="alert error"><i data-lucide="calendar-x"></i><div><b>Çakışma:</b> ' + V.esc(V.cust(clash.customer).name) + ' ' + clash.start + ' (' + (clash.staff === d.staff ? V.staff(d.staff).name : V.dev(d.device).name) + ' dolu). Başka bir saat seçin.</div></div>' : '') +
        (outside && !clash ? '<div class="alert warning"><i data-lucide="clock"></i>' + V.esc(st.name) + ' ' + st.hours[0] + ':00–' + st.hours[1] + ':00 arası çalışıyor.</div>' : '') +
        (d.customer ? '<div class="field"><label>Paket</label><select class="select" name="pkg" data-change="pkgPick">' + V.opt('', 'Paketsiz (seans ücreti ' + V.money(V.svcPrice(d.service, d.area)) + ')', d.pkg) + pk.map((p) => V.opt(p.id, V.tpl(p.template).name + ' · ' + (V.tpl(p.template).sessions - p.used) + ' seans kaldı', d.pkg)).join('') + '</select></div>' : '') +
        '<label class="chk"><input type="checkbox" name="sms"' + (d.sms ? ' checked' : '') + '> 24 saat önce SMS hatırlatması gönder</label>',
      foot: '<button class="btn" data-act="closeDrawer">Vazgeç</button><button class="btn primary" data-act="saveAppt"' + (ok ? '' : ' disabled style="opacity:.5;pointer-events:none"') + '>Randevuyu kaydet</button>'
    };
  };
  V.act.newApptFor = (el) => V.act.newAppt(null, null, { customer: el.dataset.id, service: (V.cust(el.dataset.id).staffPref === 'es' ? 'masaj' : 'lazer') });
  V.act.pkgPick = () => { V.syncDrawer(); V.UI.drawer.data.pkgTouched = true; V.renderDrawer(); };
  V.act.saveAppt = () => {
    V.syncDrawer(); const d = V.UI.drawer.data;
    const a = { id: V.id('appt', 'a'), customer: d.customer, staff: d.staff, service: d.service, area: d.area || undefined, device: d.device || undefined, date: d.date, start: d.start, dur: V.svcDur(d.service, d.area), status: 'booked', pkg: d.pkg || undefined };

/* Victoria demo — cash desk: new sale (incl. pay later & package), sales & refunds, receivables, expenses, day close, customer account. */
(function () {
  const S = () => V.S;
  const METHOD = { kart: 'Kart', nakit: 'Nakit', havale: 'Havale/EFT', sonra: 'Sonra öde' };

  V.saleRefunded = (s) => (s.refunds || []).reduce((a, r) => a + r.amount, 0);
  const baseTotal = V.saleTotal;
  V.saleTotal = (s) => baseTotal(s) - V.saleRefunded(s);
  V.payLabel = (s) => { const m = (s.payments || []).map((p) => METHOD[p.method] + (s.payments.length > 1 ? ' ' + V.money(p.amount) : '')); if (s.plan) m.push('Sonra öde'); return m.join(' + ') || (V.saleTotal(s) ? '-' : 'Paket seansı'); };

  // ---------- Cart ----------
  V.newCart = (cid) => ({ customer: cid || null, appt: null, lines: [], discount: 0, pay: { method: 'kart', down: '', downMethod: 'nakit', count: '3', first: V.addMonths(V.TODAY, 1) } });
  V.cartFor = (cid, keep) => {
    const c = S().cart;
    if (c && (c.customer === (cid || null))) return c;
    if (c && keep && !c.customer && !c.lines.length) { c.customer = cid || null; return c; }
    if (c && keep && !c.customer && !cid) return c;
    S().cart = V.newCart(cid); return S().cart;
  };
  const cartTotal = (c) => c.lines.reduce((a, l) => a + V.lineTotal(l), 0) - (+c.discount || 0);
  V.planPreview = (total, pay) => {
    const down = Math.min(V.num(pay.down), total), rest = total - down, n = Math.max(1, +pay.count || 1), each = Math.floor(rest / n);
    const out = []; for (let i = 0; i < n; i++) out.push({ due: V.addMonths(pay.first || V.addMonths(V.TODAY, 1), i), amount: i === n - 1 ? rest - each * (n - 1) : each, paid: 0 });
    return { down, rest, inst: rest > 0 ? out : [] };
  };

  // ---------- Screen ----------
  V.screens.kasa = (r) => {
    if (r.q.appt) {
      const a = V.appt(r.q.appt);
      if (a && a.status === 'completed' && (!S().cart || S().cart.appt !== a.id)) {
        const cart = V.newCart(a.customer); cart.appt = a.id;
        const p = a.pkg ? V.pkg(a.pkg) : null;
        cart.lines.push(p ? { type: 'session', ref: a.service, name: V.svcLabel(a.service, a.area) + ' (paket ' + p.used + '/' + V.tpl(p.template).sessions + ')', qty: 1, price: 0, staff: a.staff }
          : { type: 'service', ref: a.service, name: V.svcLabel(a.service, a.area), qty: 1, price: V.svcPrice(a.service, a.area), staff: a.staff });
        S().cart = cart; V.save();
      }
      V.UI.tab_kasa = 'satis';
      V.UI.at = '#/kasa';
    }
    if (r.q.tab) { V.UI.tab_kasa = r.q.tab; V.UI.at = '#/kasa'; }

})();

/* ---- screens-admin.js ---- */
/* Victoria demo — catalog & stock, team, settings. Read-mostly; enough to verify the setup. */
(function () {
  const S = () => V.S;

  V.screens.katalog = (r) => {
    if (r.q.tab) V.UI.tab_katalog = r.q.tab;
    const tab = V.UI.tab_katalog || 'hizmet';
    let body = '';
    if (tab === 'hizmet') {
      body = '<div class="card"><div class="card-body flush table-wrap"><table class="table"><thead><tr><th>Hizmet</th><th>Kategori</th><th>Süre</th><th class="num">Fiyat</th><th>Kim yapabilir</th><th>Gereklilik</th><th>Hedeflediği sorunlar</th></tr></thead><tbody>' +
        S().services.map((s) => '<tr><td><b>' + V.esc(s.name) + '</b>' + (s.areas ? '<div class="small muted">' + s.areas.length + ' bölge</div>' : '') + '</td><td>' + s.cat + '</td><td>' + (s.areas ? s.areas[0].dur + '–' + s.areas[s.areas.length - 1].dur : s.dur) + ' dk</td><td class="num">' + (s.areas ? V.money(Math.min(...s.areas.map((a) => a.price))) + '–' + V.money(Math.max(...s.areas.map((a) => a.price))) : V.money(s.price)) + '</td>' +
          '<td class="small">' + s.staff.map((id) => V.staff(id).name).join(', ') + '</td><td>' + (s.physician ? V.tag('Hekim', 'red') + ' ' : '') + (s.device ? V.tag('Sertifikalı uzman', 'indigo') + ' ' : '') + (s.consent ? V.tag('Onam') : '') + '</td><td class="small">' + (s.concerns || []).map((k) => (V.CONCERNS.find((x) => x[0] === k) || [k, k])[1]).join(', ') + '</td></tr>').join('') + '</tbody></table></div></div>';
    } else if (tab === 'urun') {
      body = '<div class="card"><div class="card-body flush table-wrap"><table class="table"><thead><tr><th>Ürün</th><th>Tür</th><th class="num">Stok</th><th class="num">Min.</th><th>Lot · SKT</th><th class="num">Fiyat</th><th>Durum</th></tr></thead><tbody>' +
        S().products.map((p) => '<tr><td><b>' + V.esc(p.name) + '</b>' + (p.retail ? '<div class="small muted">' + V.esc(p.why) + '</div>' : '') + '</td><td>' + (p.retail ? V.tag('Perakende', 'blue') : V.tag('Sarf malzemesi')) + '</td><td class="num">' + p.stock + '</td><td class="num">' + p.min + '</td><td>' + (p.lot ? p.lot + ' · ' + V.ds(p.exp) : '-') + '</td><td class="num">' + (p.retail ? V.money(p.price) : '-') + '</td><td>' +
          (p.stock <= 0 ? V.tag('Stokta yok', 'red') : p.stock < p.min ? V.tag('Kritik', 'orange') : V.tag('Normal', 'green')) + '</td></tr>').join('') + '</tbody></table></div></div>';
    } else if (tab === 'paket') {
      body = '<div class="card"><div class="card-body flush table-wrap"><table class="table"><thead><tr><th>Paket</th><th class="num">Seans</th><th>Geçerlilik</th><th class="num">Fiyat</th><th class="num">Seans başı</th><th class="num">Satılan</th></tr></thead><tbody>' +
        S().templates.map((t) => '<tr><td><b>' + V.esc(t.name) + '</b></td><td class="num">' + t.sessions + '</td><td>' + t.months + ' ay</td><td class="num">' + V.money(t.price) + '</td><td class="num">' + V.money(t.price / t.sessions) + '</td><td class="num">' + S().packages.filter((p) => p.template === t.id).length + '</td></tr>').join('') + '</tbody></table></div></div>';
    } else {
      body = '<div class="card"><div class="card-body flush table-wrap"><table class="table"><thead><tr><th>Tarih</th><th>Ürün</th><th>Tür</th><th>Kaynak</th><th>Personel</th><th class="num">Miktar</th></tr></thead><tbody>' +
        S().moves.map((m) => '<tr><td>' + V.ds(m.date) + ' ' + (m.time || '') + '</td><td>' + V.esc(V.prod(m.product).name) + '</td><td>' + V.tag(m.type, m.type === 'Satış' ? 'blue' : m.type === 'Uygulama' ? 'indigo' : m.type === 'Mal kabul' || m.type === 'İade' ? 'green' : '') + '</td><td>' + V.esc(m.ref) + '</td><td>' + V.esc(V.staff(m.by).name) + '</td><td class="num ' + (m.qty < 0 ? 'down' : 'up') + '">' + (m.qty > 0 ? '+' : '') + m.qty + '</td></tr>').join('') + '</tbody></table></div></div>';
    }
    return V.header('Katalog ve stok', 'Hizmetler, ürünler, paketler ve stok hareketleri') +
      V.tabs('katalog', [['hizmet', 'Hizmetler', 'sparkles'], ['urun', 'Ürünler', 'package'], ['paket', 'Paketler', 'gift'], ['stok', 'Stok hareketleri', 'boxes']], tab) + body;
  };

  V.screens.ekip = () => {
    const rows = S().staff.filter((s) => s.kind !== 'owner').map((s) => {
      const today = S().appts.filter((a) => a.staff === s.id && a.date === V.TODAY && a.status !== 'cancelled');
      const base = S().baseline.staff[s.id] || [0, 0, 0];
      const lines = S().sales.filter((x) => x.date >= '2026-11-12').flatMap((x) => x.lines).filter((l) => l.staff === s.id);
      return '<tr><td><div class="row"><span class="avatar">' + V.esc(s.initials) + '</span><b>' + V.esc(s.name) + '</b></div></td><td>' + V.esc(s.title) + '</td><td>' + (s.hours ? s.hours[0] + ':00–' + s.hours[1] + ':00' : '09:00–19:00') + '</td><td class="num">' + today.length + '</td><td class="num">' +
        V.money(base[1] + lines.reduce((a, l) => a + V.lineTotal(l), 0)) + '</td><td class="num">' + (base[2] + lines.filter((l) => l.type === 'product').reduce((a, l) => a + l.qty, 0)) + '</td></tr>';
    }).join('');
    return V.header('Ekip', 'Kim ne yaptı, ne sattı. Prim şu an: <b>' + V.esc(S().decisions.commission) + '</b>') +
      '<div class="card"><div class="card-body flush table-wrap"><table class="table"><thead><tr><th>Personel</th><th>Görev</th><th>Çalışma saatleri</th><th class="num">Bugünkü randevu</th><th class="num">Bu ay ciro</th><th class="num">Bu ay satılan ürün</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<div class="alert info mt"><i data-lucide="info"></i><div>Gerçek uygulamada personel ayrıntısında yaptığı her işlem, çalışma planı, izinler, yetkinlikler ve (açıksa) prim dökümü bulunur.</div></div>';
  };

  V.screens.ayarlar = () => {
    const d = S().decisions, b = S().business;
    return V.header('Ayarlar', 'Bu denemede kurallar "Nasıl test edilir?" sayfasındaki cevaplarınızdan gelir.', '<a class="btn" href="#/baslangic"><i data-lucide="flag"></i>Cevapları değiştir</a>') +
      '<div class="grid g2"><div class="card"><div class="card-head"><h3>İşletme</h3></div><div class="card-body"><dl class="desc"><dt>Ad</dt><dd>' + V.esc(b.name) + '</dd><dt>Telefon</dt><dd>' + b.phone + '</dd><dt>Adres</dt><dd>' + V.esc(b.address) + '</dd><dt>Para birimi</dt><dd>TRY · KDV %20 dahil</dd><dt>Diller</dt><dd>Türkçe, İngilizce</dd></dl></div></div>' +
      '<div class="card"><div class="card-head"><h3>Kurallar</h3></div><div class="card-body"><dl class="desc"><dt>Geç iptal</dt><dd>' + V.esc(d.lateCancel) + '</dd><dt>Gelmeyen müşteri</dt><dd>' + V.esc(d.noShow) + '</dd><dt>Borç limiti</dt><dd>' + (+d.creditLimit ? V.money(+d.creditLimit) : 'Limit yok') + '</dd><dt>En fazla taksit</dt><dd>' + d.maxInst + '</dd><dt>Resmi fiş</dt><dd>' + V.esc(d.receipt) + '</dd><dt>Prim</dt><dd>' + V.esc(d.commission) + '</dd><dt>Yalnızca hekim</dt><dd>' + d.physician.map((id) => V.svc(id).name).join(', ') + '</dd></dl></div></div>' +
      '<div class="card"><div class="card-head"><h3>Kullanıcılar</h3></div><div class="card-body flush"><table class="table"><thead><tr><th>Kişi</th><th>Rol</th><th>Giriş</th></tr></thead><tbody>' + S().staff.map((s) => '<tr><td>' + V.esc(s.name) + '</td><td>' + V.esc(s.title) + '</td><td>' + (s.kind === 'owner' ? 'Şifre + iki adımlı doğrulama, sonra PIN' : 'PIN') + '</td></tr>').join('') + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-head"><h3>Lazer cihazları</h3></div><div class="card-body flush"><table class="table"><thead><tr><th>Cihaz</th><th>Tür</th><th>Başlık ömrü</th></tr></thead><tbody>' + S().devices.map((x) => '<tr><td>' + x.name + '</td><td>' + x.type + ' · ' + x.wave + '</td><td><div class="progress' + (x.shots / x.life > 0.9 ? ' red' : '') + '" style="width:120px"><span style="width:' + Math.round(x.shots / x.life * 100) + '%"></span></div><span class="small">' + x.shots.toLocaleString('tr-TR') + ' / ' + x.life.toLocaleString('tr-TR') + ' atım</span></td></tr>').join('') + '</tbody></table></div></div></div>' +
      '<div class="card mt"><div class="card-body row between wrap"><span>Denemeyi baştan başlatmak için verileri sıfırlayın.</span><button class="btn danger" data-act="reset"><i data-lucide="rotate-ccw"></i>Demoyu sıfırla</button></div></div>';
  };
})();
